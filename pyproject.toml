[project]
name = "taming-the-ito-lyon"
version = "0.1.0"
description = "Code for the ICML2026 paper Learning Manifold and Itô Dynamics with Branched Neural Rough Differential Equations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax[cuda]>=0.9.1",
    "diffrax>=0.7.1",
    "equinox>=0.13.2",
    "optax>=0.2.6",
    "cyreal",
    "numpy>=2.0.0",
    "scipy>=1.16.0",
    "pydantic>=2.12.3",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.8",
    "optuna>=4.6.0",
    "lovely-jax>=0.1.4",
    "diffrax-lowstorage",
    "georax",
    "pysiglib[cuda]>=4.0.0",
    "roughrax"
]

[tool.uv.sources]
cyreal = { git = "https://github.com/luke-a-thompson/cyreal_dynamics.git", branch = "master" }
diffrax = { git = "https://github.com/sammccallum/diffrax", rev = "aeb1335b5a6278e85a270231e0f97b8db4453ae6" }
diffrax-lowstorage = { git = "https://github.com/luke-a-thompson/diffrax-lowstorage.git", rev = "3f72fe75660ed325bfc35086239950c73c3e98c8" }
georax = { git = "https://github.com/luke-a-thompson/georax.git", rev = "8cbae326c64eccd0a2c37d1ea7767a14cc29b8ae" }
roughrax = { git = "https://github.com/luke-a-thompson/roughrax.git", rev = "4a73da1c0e9d01dd3910063b8989c1a0f212d90d" }
torch = { index = "pytorch-cpu" }

[tool.uv]
# Use the reviewed revisions even when dependencies declare their own Git sources.
override-dependencies = [
    "georax @ git+https://github.com/luke-a-thompson/georax.git@8cbae326c64eccd0a2c37d1ea7767a14cc29b8ae",
    "diffrax-lowstorage @ git+https://github.com/luke-a-thompson/diffrax-lowstorage.git@3f72fe75660ed325bfc35086239950c73c3e98c8",
    # Use the published PySigLib package instead of Roughrax's Git source.
    "pysiglib[cuda]>=4.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
train = "taming_the_ito_lyon.training.train_cli:main"
test = "taming_the_ito_lyon.training.test_cli:main"
optimize = "taming_the_ito_lyon.training.optimize_cli:main"
tables = "taming_the_ito_lyon.paper.tables_cli:main"
shapes = "taming_the_ito_lyon.data.shapes_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["taming_the_ito_lyon"]

[tool.hatch.metadata]
allow-direct-references = true
