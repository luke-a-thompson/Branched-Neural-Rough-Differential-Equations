[experiment_config]
model_type = "log_ncde"
dataset_name = "simple_rbergomi"

# Optimizer
optimizer = "adamw"
learning_rate = 3e-4
weight_decay = 0.000001
max_grad_norm = 1.0

# Training
loss = "sigker"
seed = 2
batch_size = 1024
epochs = 100

# Training mode
training_mode = "unconditional"
# Unconditional generation samples a Brownian motion with this many channels.

manifold = "euclidean"
hidden_state_mode = "euclidean"
evolving_out = true

early_stopping_patience = 100
[solver_config]
stepsize_controller = "constant"
solver = "ees252n"       # tsit5, bosh3, dopri5, dopri8, heun, euler, ees25
adjoint = "reversble"  # recursive_checkpoint, direct
rtol = 1e-3
atol = 1e-3
dtmin = 1e-4

[log_ncde_config]

# Log-NCDE model parameters
cde_state_dim = 32         # Jacobian burden, quadratic in this
init_hidden_dim = 32
vf_hidden_dim = 32
initial_cond_mlp_depth = 2
vf_mlp_depth = 2
out_size = 1

# Log-signature configuration
signature_depth = 2
signature_window_size = 16
